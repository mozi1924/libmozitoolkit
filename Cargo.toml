[workspace]
resolver = "2"
members = [
    "crates/mtk-core",
    "crates/mtk-cull",
    "crates/mtk-model",
    "crates/mtk-voxel",
    "crates/mtk-sync",
    "crates/mtk-resource",
    "crates/mtk-texture",
    "crates/mtk-material",
    "crates/mtk-save",
    "crates/mtk-package",
    "crates/libmtk",
    "crates/mtk-bench",
    "crates/mtk-cli",
    "crates/mtk-testkit",
    "bindings/mtk-py",
    "bindings/mtk-ffi",
    "bindings/mtk-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mozi <mozi1924@arasaka.ltd>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/mozi1924/libmozitoolkit"
readme = "README.md"
rust-version = "1.80.0"
[workspace.dependencies]
clap = { version = "4.5", default-features = false, features = ["derive", "std", "help", "usage", "error-context"] }
glam = { version = "0.33.7", default-features = false, features = ["libm", "serde", "all-types"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
bincode = "1.3.3"
thiserror = { version = "2.0.20", default-features = false }
bitflags = { version = "2.13.1", default-features = false, features = ["serde"] }
tinyvec = { version = "1.13.2", default-features = false, features = ["alloc"] }
rayon = { version = "1.12.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pyo3 = { version = "0.24.2", default-features = false, features = ["macros"] }
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
console_error_panic_hook = { version = "0.1.7", default-features = false }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
crossbeam-channel = { version = "0.5.15", default-features = false, features = ["std"] }
url = { version = "2.5", default-features = false }
flate2 = { version = "1.0", default-features = false, features = ["rust_backend"] }
rustc-hash = { version = "2.1", features = ["std"] }
zstd = "0.13"
crc32fast = "1.4"
memmap2 = "0.9"
bytemuck = { version = "1.25", default-features = false }

# Internal workspace crates
mtk-core = { path = "crates/mtk-core", version = "0.1.0" }
mtk-cull = { path = "crates/mtk-cull", version = "0.1.0" }
mtk-model = { path = "crates/mtk-model", version = "0.1.0" }
mtk-voxel = { path = "crates/mtk-voxel", version = "0.1.0" }
mtk-sync = { path = "crates/mtk-sync", version = "0.1.0" }
mtk-resource = { path = "crates/mtk-resource", version = "0.1.0" }
mtk-texture = { path = "crates/mtk-texture", version = "0.1.0" }
mtk-material = { path = "crates/mtk-material", version = "0.1.0" }
mtk-save = { path = "crates/mtk-save", version = "0.1.0" }
mtk-package = { path = "crates/mtk-package", version = "0.1.0" }
libmtk = { path = "crates/libmtk", version = "0.1.0" }
mtk-testkit = { path = "crates/mtk-testkit", version = "0.1.0" }

# Workspace-wide Clippy policy (opt in per-crate via `[lints] workspace = true`).
# Keep this list small and justified: it only suppresses lints that are inherent to the
# FFI/PyO3 surface, the minimum supported Rust version, or deliberate API naming.
[workspace.lints.clippy]
# PyO3 `#[pyfunction]` / mesher batch entry points legitimately accept many flat parameters
# to avoid per-call allocation and preserve zero-copy semantics.
too_many_arguments = "allow"
# Parallel batch APIs return nested Rayon tuple results (e.g. `Vec<(Vec<f32>, Vec<u16>)>`).
type_complexity = "allow"
# `is_multiple_of` was stabilized in Rust 1.87, above our declared 1.80 MSRV.
manual_is_multiple_of = "allow"
# Deliberate domain-prefixed enum variants and the historical `stitcher::stitcher` layout.
enum_variant_names = "allow"
module_inception = "allow"
# `from_str`/`parse` helpers are internal constructors, not `std::str::FromStr` impls.
should_implement_trait = "allow"
# A few enums carry one intentionally large (baked geometry) variant.
large_enum_variant = "allow"
# Flat-buffer batch kernels index several parallel arrays in lockstep; iterator rewrites
# obscure the index arithmetic used for raw pointer offsets.
needless_range_loop = "allow"
# Serde `serialize_with` / `deserialize_with` signatures must match the on-disk field type
# (which is a `Box<[...]>`).
borrowed_box = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = false
