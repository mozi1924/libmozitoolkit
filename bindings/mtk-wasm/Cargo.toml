[package]
name = "mtk-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly bindings for libmozitoolkit using wasm-bindgen."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
libmtk = { workspace = true }
mtk-core = { workspace = true }
mtk-cull = { workspace = true }
mtk-voxel = { workspace = true }
mtk-model = { workspace = true }
mtk-material = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
console_error_panic_hook = { workspace = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }

# Enable the JS-backed entropy backend required by `getrandom` on wasm32-unknown-unknown.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[features]
default = ["std"]
std = [
    "libmtk/std",
    "mtk-core/std",
    "mtk-cull/std",
    "mtk-voxel/std",
    "mtk-model/std",
    "mtk-material/std",
]
parallel = [
    "dep:wasm-bindgen-rayon",
    "libmtk/parallel",
    "mtk-core/parallel",
    "mtk-voxel/parallel",
    "mtk-model/parallel",
    "mtk-material/parallel",
    "std",
]

[lints]
workspace = true
