name: Build & Release Wheels

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto, rolling, or official)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - rolling
          - official
      tag_name:
        description: 'Custom tag name (optional, only for official release)'
        required: false
        default: ''

concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-wheels:
    name: Wheel (${{ matrix.platform_id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform_id: linux-x64
            # Pinned so wheel filenames stay stable across runner upgrades.
            # `auto` changes tag when the runner image changes (2_17 → 2_28 → 2_34),
            # which leaves stale duplicates on the release.
            manylinux: "2_28"
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform_id: linux-arm64
            manylinux: "2_28"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform_id: windows-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            platform_id: windows-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            platform_id: macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            platform_id: macos-arm64

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Generic Cargo cache: downloads registry, git deps and compiled artifacts.
      # Works for host builds (macOS/Windows) and for maturin-action's manylinux
      # Docker builds because the workspace `target/` directory is bind-mounted.
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform_id }}
          workspaces: ". -> target"

      - name: Build core wheel via maturin-action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist -m bindings/mtk-py/Cargo.toml

      - name: Build Blender DNA wheel via maturin-action
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'off' }}
          args: --release --out dist -m adapters/blender/mtk-blender-dna-py/Cargo.toml

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: libmtk-wheel-${{ matrix.platform_id }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 3

  publish-wheels:
    name: Publish Wheels to Release
    needs: build-wheels
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: libmtk-wheel-*
          path: dist
          merge-multiple: true

      - name: Verify wheel matrix
        run: |
          set -euo pipefail
          ls -lh dist/
          # Per-platform check (not just a file count): exactly one abi3 wheel
          # for each of the six supported targets, for both distributions.
          python3 tools/verify_wheels.py dist --prefix libmtk_py
          python3 tools/verify_wheels.py dist --prefix libmtk_blender_dna --max-size-bytes 1500000

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum *.whl > SHA256SUMS.txt
          echo "=== SHA256SUMS.txt ==="
          cat SHA256SUMS.txt

      - name: Determine Release Target
        id: release_meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.release_type }}" = "official" ] || ([ "${{ inputs.release_type }}" = "auto" ] && [ -n "${{ inputs.tag_name }}" ]); then
              TARGET_TAG="${{ inputs.tag_name }}"
              if [ -z "$TARGET_TAG" ]; then
                echo "::error::tag_name is required for official release"
                exit 1
              fi
              IS_PRERELEASE="false"
            else
              TARGET_TAG="ci-latest"
              IS_PRERELEASE="true"
            fi
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TARGET_TAG="${{ github.ref_name }}"
            IS_PRERELEASE="false"
          else
            TARGET_TAG="ci-latest"
            IS_PRERELEASE="true"
          fi

          echo "tag=$TARGET_TAG" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=$IS_PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Target Release Tag: $TARGET_TAG (Pre-release: $IS_PRERELEASE)"

      - name: Prune stale wheel assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release '$TAG' does not exist yet; nothing to prune."
            exit 0
          fi

          # Keep only the wheels from this run. `gh release upload --clobber`
          # overwrites same-named assets but never removes renamed ones, so old
          # manylinux tags (or dropped platforms) would accumulate forever and
          # could be picked up by consumers.
          mapfile -t existing < <(
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
              --json assets --jq '.assets[].name' | grep -E '\.whl$' || true
          )
          for name in "${existing[@]}"; do
            if [ ! -f "dist/$name" ]; then
              echo "Removing stale asset: $name"
              gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done
          echo "Checked ${#existing[@]} existing wheel asset(s)."

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          IS_PRERELEASE: ${{ steps.release_meta.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [ "$TAG" = "ci-latest" ]; then
            gh release view ci-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
              gh release create ci-latest --repo "$GITHUB_REPOSITORY" --prerelease \
                --title "CI rolling wheels (ci-latest)" \
                --notes "Automated abi3 wheels for all 6 platforms built from main. Updated continuously."
            gh release upload ci-latest dist/* --repo "$GITHUB_REPOSITORY" --clobber
            echo "Successfully updated rolling release ci-latest."
          else
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "Release $TAG exists, uploading assets..."
              gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            else
              echo "Creating new release $TAG..."
              gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" \
                --title "libmozitoolkit $TAG" \
                --generate-notes
            fi
            echo "Successfully published official release $TAG."
          fi
