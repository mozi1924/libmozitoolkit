[workspace]
resolver = "2"
members = [
    "crates/mtk-core",
    "crates/mtk-cull",
    "crates/mtk-model",
    "crates/mtk-voxel",
    "crates/libmtk",
    "crates/mtk-bench",
    "crates/mtk-tools",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mozi <mozi1924@arasaka.ltd>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/mozi1924/libmozitoolkit"
readme = "README.md"
rust-version = "1.80.0"
[workspace.dependencies]
glam = { version = "0.33", default-features = false, features = ["libm", "serde", "all-types"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1.0", default-features = false, features = ["alloc"] }
thiserror = { version = "2.0", default-features = false }
bitflags = { version = "2.6", default-features = false, features = ["serde"] }
tinyvec = { version = "1.8", default-features = false, features = ["alloc"] }
rayon = { version = "1.10", default-features = false }
zip = { version = "2.2", default-features = false, features = ["deflate"] }






# Internal workspace crates
mtk-core = { path = "crates/mtk-core", version = "0.1.0" }
mtk-cull = { path = "crates/mtk-cull", version = "0.1.0" }
mtk-model = { path = "crates/mtk-model", version = "0.1.0" }
mtk-voxel = { path = "crates/mtk-voxel", version = "0.1.0" }
libmtk = { path = "crates/libmtk", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
