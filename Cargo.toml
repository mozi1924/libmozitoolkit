[workspace]
resolver = "2"
members = [
    "crates/mtk-core",
    "crates/mtk-cull",
    "crates/mtk-model",
    "crates/mtk-voxel",
    "crates/mtk-resource",
    "crates/mtk-texture",
    "crates/mtk-material",
    "crates/libmtk",
    "crates/mtk-bench",
    "crates/mtk-tools",
    "bindings/mtk-py",
    "bindings/mtk-ffi",
    "bindings/mtk-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mozi <mozi1924@arasaka.ltd>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/mozi1924/libmozitoolkit"
readme = "README.md"
rust-version = "1.80.0"
[workspace.dependencies]
glam = { version = "0.33.7", default-features = false, features = ["libm", "serde", "all-types"] }
serde = { version = "1.0.229", default-features = false, features = ["derive", "alloc", "std"] }
serde_json = { version = "1.0.151", default-features = false, features = ["alloc"] }
bincode = "1.3.3"
thiserror = { version = "2.0.20", default-features = false }
bitflags = { version = "2.13.1", default-features = false, features = ["serde"] }
tinyvec = { version = "1.13.2", default-features = false, features = ["alloc"] }
rayon = { version = "1.12.0", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
pyo3 = { version = "0.24.2", default-features = false, features = ["macros"] }
wasm-bindgen = "0.2.100"
js-sys = "0.3.77"
console_error_panic_hook = { version = "0.1.7", default-features = false }
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
crossbeam-channel = { version = "0.5.15", default-features = false, features = ["std"] }
url = { version = "2.5", default-features = false }

# Internal workspace crates
mtk-core = { path = "crates/mtk-core", version = "0.1.0" }
mtk-cull = { path = "crates/mtk-cull", version = "0.1.0" }
mtk-model = { path = "crates/mtk-model", version = "0.1.0" }
mtk-voxel = { path = "crates/mtk-voxel", version = "0.1.0" }
mtk-resource = { path = "crates/mtk-resource", version = "0.1.0" }
mtk-texture = { path = "crates/mtk-texture", version = "0.1.0" }
mtk-material = { path = "crates/mtk-material", version = "0.1.0" }
libmtk = { path = "crates/libmtk", version = "0.1.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
