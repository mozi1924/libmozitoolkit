[package]
name = "mtk-save"
version = "0.1.0"
edition = "2021"
authors = ["Mozi <mozi1924@arasaka.ltd>"]
license = "GPL-3.0-or-later"
description = "High-performance Minecraft save (Anvil MCA) loader for MoziToolKit"

[dependencies]
flate2 = { workspace = true }
glam = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
rayon = { workspace = true }
mtk-core = { workspace = true }
mtk-voxel = { workspace = true }

[features]
default = ["std"]
std = []
serde = ["dep:serde", "dep:serde_json", "mtk-core/serde", "mtk-voxel/serde"]
