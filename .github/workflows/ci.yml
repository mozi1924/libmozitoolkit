name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  # Temporary real-pack asset mirror (see `tests` job). Remove this variable and the
  # "Download real Minecraft assets" step once CI migrates to a maintained source.
  # The step is intentionally non-fatal: if the mirror disappears, tests fall back to the
  # vendored `mtk-testkit` fixtures instead of failing.
  MTK_CI_ASSETS_BASE: https://github.com/mozi1924/mtk-ci-assets/releases/download/ci-assets-v1

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy (-D warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (workspace, real packs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip
      - name: Download real Minecraft assets
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/mtk-assets"
          mkdir -p "$work"
          if curl -fL --retry 3 -o "$work/mc.jar" "$MTK_CI_ASSETS_BASE/26.2-Fabric.jar"; then
            mkdir -p "$work/mc"
            unzip -q "$work/mc.jar" -d "$work/mc"
            echo "MTK_TEST_ASSETS=$work/mc" >> "$GITHUB_ENV"
            echo "MTK_TEST_JAR=$work/mc.jar" >> "$GITHUB_ENV"
          else
            echo "::warning::Real Minecraft jar unavailable; real-pack tests will fall back to vendored fixtures."
          fi
          if curl -fL --retry 3 -o "$work/SPBR-21.zip" "$MTK_CI_ASSETS_BASE/SPBR-21.zip"; then
            echo "MTK_TEST_RESOURCE_PACK=$work/SPBR-21.zip" >> "$GITHUB_ENV"
          else
            echo "::warning::External resource pack unavailable; companion-pack tests will be skipped."
          fi
      - name: cargo test --workspace
        run: cargo test --workspace --no-fail-fast

  wasm:
    name: WASM compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (mtk-wasm)
        run: cargo check -p mtk-wasm --target wasm32-unknown-unknown

  python-wheel:
    name: Python wheel (abi3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --release --out dist -m bindings/mtk-py/Cargo.toml
      - name: Verify wheel imports
        run: |
          python -m pip install dist/*.whl
          python -c "import libmtk_py; print('libmtk_py', libmtk_py.version())"
      - uses: actions/upload-artifact@v4
        with:
          name: libmtk-py-wheel
          path: dist/*.whl

  # Publishes the manylinux abi3 wheel to a rolling `ci-latest` pre-release so that
  # downstream consumers (MoziToolKit CI) can fetch a real packaged artifact via a fast
  # GitHub-internal download instead of rebuilding the Rust workspace.
  publish-wheel:
    name: Publish rolling ci-latest wheel
    needs: python-wheel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: libmtk-py-wheel
          path: dist
      - name: Upload wheel to ci-latest pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ci-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ci-latest --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "CI rolling wheel (ci-latest)" \
              --notes "Automated abi3 wheel built from main. Not a published release."
          gh release upload ci-latest dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
